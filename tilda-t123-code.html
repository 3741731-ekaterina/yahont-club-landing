<iframe id="yahontFrame" src="https://klub-mu.vercel.app/" style="width:100%;height:100vh;border:none;display:block;"></iframe>
<script>
window.addEventListener('message', function(e){
  var frame = document.getElementById('yahontFrame');
  if (e.data && e.data.type === 'yahont-resize') {
    frame.style.height = e.data.height + 'px';
  }
  if (e.data && e.data.type === 'yahont-scrollto') {
    var frameTop = frame.getBoundingClientRect().top + window.scrollY;
    window.scrollTo({ top: frameTop + e.data.top, behavior: 'smooth' });
  }
});
</script>
