<iframe id="yahontFrame" src="https://klub-ruby.vercel.app/" style="width:100%;height:100vh;border:none;display:block;"></iframe>
<script>
window.addEventListener('message', function(e){
  if (e.data && e.data.type === 'yahont-resize') {
    document.getElementById('yahontFrame').style.height = e.data.height + 'px';
  }
});
</script>
